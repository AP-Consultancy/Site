# Render Blueprint — AP Consultancy marketing site (Vite + React SPA)
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/AP-Consultancy/Site

services:
  - type: web
    name: ap-consultancy-site
    runtime: static
    repo: https://github.com/AP-Consultancy/Site
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /Card/*
        name: Cache-Control
        value: public, max-age=604800
    envVars:
      - key: NODE_VERSION
        value: "20"
